spring.datasource.url=jdbc:h2:mem:studymate;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql

security.jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.auth-rate-limit.login.account-limit=10000
app.auth-rate-limit.login.origin-limit=10000
app.auth-rate-limit.login.global-limit=10000
app.auth-rate-limit.register.account-limit=10000
app.auth-rate-limit.register.origin-limit=10000
app.auth-rate-limit.register.global-limit=10000
app.auth-rate-limit.verify.account-limit=10000
app.auth-rate-limit.verify.origin-limit=10000
app.auth-rate-limit.verify.global-limit=10000
app.auth-rate-limit.email-change.account-limit=10000
app.auth-rate-limit.email-change.origin-limit=10000
app.auth-rate-limit.email-change.global-limit=10000
