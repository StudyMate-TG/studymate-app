# Local database configuration (file ignored by Git).
spring.config.import=optional:file:./backend.local.properties,optional:file:./backend/backend.local.properties

server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=studymate-api
security.jwt.audience=studymate-app
security.jwt.ttl-seconds=3600
app.http.max-body-bytes=65536
app.smtp.host=${SMTP_HOST:}
app.smtp.port=${SMTP_PORT:587}
app.smtp.username=${SMTP_USERNAME:}
app.smtp.password=${SMTP_PASSWORD:}
app.smtp.from=${SMTP_FROM:}
app.smtp.starttls=${SMTP_STARTTLS:true}
app.email-verification.ttl-seconds=900
app.email-verification.max-pending=1000
app.tasks.max-count=1000
app.tasks.max-description=4096
app.tasks.max-stored-chars=4096000
server.forward-headers-strategy=none
