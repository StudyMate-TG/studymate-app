# Ambiente de teste isolado, ativado apenas pelo perfil local.
server.address=0.0.0.0
spring.datasource.url=jdbc:h2:file:./.local/studymate;MODE=Oracle;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-local.sql
app.smtp.host=localhost
app.smtp.from=studymate@localhost
app.smtp.starttls=false
